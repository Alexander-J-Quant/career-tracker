  var dig=Sha256.hash(keyBytes.concat(ctrBytes(ctr)));
  out=out.concat(dig);ctr++;}
 return out.slice(0,n);}

function b64d(s){
 var lookup='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
 s=s.replace(/=+$/,'');var bytesArr=[],i,bits=0,cur=0;
 for(i=0;i<s.length;i++){
  var v=lookup.indexOf(s[i]);if(v===-1)continue;
  cur=(cur<<6)|v;bits+=6;
  if(bits>=8){bytesArr.push((cur>>(bits-8))&255);bits-=8;}}
 return bytesArr;}

(function(){
 var frag=location.hash.substring(1);
 var msg=document.getElementById('msg');
 if(!frag){msg.textContent='missing key';return;}
 try{
  var key=Sha256.bytes(decodeURIComponent(frag));
  var ctB64=document.getElementById('ct').textContent.trim();
  var ct=b64d(ctB64);
  var ks=keystream(key,ct.length);
  var pt='';
  for(var i=0;i<ct.length;i++)pt+=String.fromCharCode(ct[i]^ks[i]);
  var ok=pt.charCodeAt(pt.length-1);
  pt=pt.substring(0,pt.length-1);
  if(ok!==(Sha256.hash(Sha256.bytes(pt))[0]&1)){msg.textContent='wrong key';return;}
  var bodyM=/<body[^>]*>([\s\S]*?)<\/body>/i.exec(pt);
  var styleM=/<style[\s\S]*?<\/style>/i.exec(pt);
  var titleM=/<title>([\s\S]*?)<\/title>/i.exec(pt);
  if(!bodyM){msg.textContent='no body in plaintext';return;}
  if(styleM)document.head.innerHTML=styleM[0];
  if(titleM)document.title=titleM[1];
  document.body.innerHTML=bodyM[1];
  msg.style.display='none';
 }catch(e){msg.textContent='error: '+e.message;}
})();
</script></body></html>
